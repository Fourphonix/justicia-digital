name: CI/CD Pipeline Seguro y Legal

on:
  push:
    branches: [ "main" ]

# Permisos mínimos requeridos (Principio de Mínimo Privilegio)
permissions:
  contents: read
  id-token: write # Requerido para autenticación OIDC sin llaves estáticas
  security-events: write

jobs:
  # ============================================================================
  # 1. ESCANEO DE SECRETOS Y ANÁLISIS ESTÁTICO (SAST / SCA)
  # ============================================================================
  security-audit:
    name: Auditoría de Seguridad y Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Prevención de fuga de credenciales
      - name: Escaneo de Secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Configuración del entorno de lenguaje
      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      # Detección de vulnerabilidades en código fuente (SAST) y dependencias (SCA)
      - name: Escaneo de Vulnerabilidades (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Pruebas unitarias y detección de condiciones de carrera (Race Conditions)
      - name: Pruebas Unitarias con Race Detector
        run: go test -v -race -coverprofile=coverage.out ./...

  # ============================================================================
  # 2. COMPILACIÓN, ESCANEO DE CONTENEDOR Y GENERACIÓN DE SBOM
  # ============================================================================
  build-and-package:
    name: Compilación Segura y Empaquetado
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compilación de la imagen Distroless multi-stage
      - name: Compilar Imagen de Contenedor
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: mi-registro-seguro/paas-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Escaneo de vulnerabilidades en el contenedor final
      - name: Escaneo de Vulnerabilidades del Contenedor (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-registro-seguro/paas-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Falla el pipeline si encuentra vulnerabilidades CRÍTICAS
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # 3. AUTENTICACIÓN FEDERADA Y DESPLIEGUE (OIDC)
  # ============================================================================
  deploy-production:
    name: Despliegue Automatizado a Producción
    needs: build-and-package
    runs-on: ubuntu-latest
    environment: production # Exige aprobación manual si está configurado en GitHub
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      # Autenticación sin secretos estáticos (OpenID Connect)
      # No se guardan llaves permanentes en los secretos del repositorio
      - name: Autenticación Cloud vía OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      # Despliegue atómico e inmutable
      - name: Actualizar Servicio en Producción
        run: |
          echo "Desplegando versión inmutable: ${{ github.sha }}"
          # Comando para actualizar Kubernetes, ECS o PaaS:
          # kubectl set image deployment/backend-api app=mi-registro-seguro/paas-backend:${{ github.sha }}
