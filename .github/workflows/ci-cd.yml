name: Production CI/CD Pipeline - Zero Trust & Hermetic Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  # 1. Calidad de Código y Análisis Estático
  code-analysis:
    name: SAST, Linter & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verificación de Formato
        run: cargo fmt -- --check

      - name: Análisis Estático con Clippy (Deny Warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Escaneo de Secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Pruebas Unitarias, Integración y Detección de Fugas
  test-suite:
    name: Tests & Memory Sanitizers
    runs-on: ubuntu-latest
    needs: code-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Ejecutar Pruebas Unitarias
        run: cargo test --verbose

  # 3. Auditoría de Dependencias y Licencias (SCA)
  security-audit:
    name: SCA, Vulnerabilities & License Compliance
    runs-on: ubuntu-latest
    needs: code-analysis
    steps:
      - uses: actions/checkout@v4

      - name: Auditoría de Vulnerabilidades en Crates
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Control Legal de Licencias (Bloqueo AGPL/GPL)
        run: |
          cargo install cargo-deny
          cargo deny check licenses

  # 4. Compilación Hermética y Generación de SBOM
  build-and-sign:
    name: Hermetic OCI Build & Cosign Attestation
    runs-on: ubuntu-latest
    needs: [test-suite, security-audit]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Cosign (Firma Criptográfica)
        uses: sigstore/cosign-installer@v3.5.0

      - name: Instalar Syft (Generador de SBOM)
        uses: anchore/sbom-action/download-syft@v0.16.0

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar Sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y Publicar Imagen OCI
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Generar Software Bill of Materials (SBOM SPDX)
        run: |
          syft ghcr.io/${{ github.repository }}:${{ github.sha }} -o spdx-json=sbom.spdx.json

      - name: Firmar Criptográficamente la Imagen y Atestar SBOM
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.sha }}
          cosign attest --yes --predicate sbom.spdx.json --type spdx ghcr.io/${{ github.repository }}:${{ github.sha }}

  # 5. Despliegue GitOps Automatizado (Zero Touch)
  gitops-sync:
    name: GitOps ArgoCD Trigger
    runs-on: ubuntu-latest
    needs: build-and-sign
    steps:
      - name: Checkout Repositorio de Manifiestos
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops-manifests
          token: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Actualizar Tag de Imagen en Despliegue K8s
        run: |
          sed -i 's|image: ghcr.io/${{ github.repository }}:.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|g' deployment.yaml
          git config user.name "CI/CD Bot"
          git config user.email "bot@infra.local"
          git commit -am "chore(deploy): release ${{ github.sha }} [skip ci]"
          git push origin main
